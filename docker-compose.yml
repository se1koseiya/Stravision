services:
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Cap 人机行为验证：构建期注入前端 widget endpoint
        NEXT_PUBLIC_CAP_API_ENDPOINT: ${NEXT_PUBLIC_CAP_API_ENDPOINT:-}
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
      # 文档库（blog/docs）：docs 目录 + manifest 索引挂载持久化（镜像内无 docs，运行时 nextjs 用户无法创建）
      - ./docs:/app/docs
      - ./lib/blog/docs-manifest.json:/app/lib/blog/docs-manifest.json
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - TZ=Asia/Shanghai
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_SUBSCRIBE_TOPIC=${MQTT_SUBSCRIBE_TOPIC}
      - MQTT_PUBLISH_TOPIC=${MQTT_PUBLISH_TOPIC}
      - MQTT_USE_SSL=${MQTT_USE_SSL}
      - MQTT_KEEPALIVE=${MQTT_KEEPALIVE}
      - MQTT_RECONNECT_PERIOD=${MQTT_RECONNECT_PERIOD}
      - WEATHER_API_KEY=${WEATHER_API_KEY}
      - WECHAT_APP_ID=${WECHAT_APP_ID}
      - WECHAT_APP_SECRET=${WECHAT_APP_SECRET}
      - WECHAT_OPEN_APP_ID=${WECHAT_OPEN_APP_ID}
      - WECHAT_OPEN_APP_SECRET=${WECHAT_OPEN_APP_SECRET}
      - ALIPAY_APP_ID=${ALIPAY_APP_ID}
      - ALIPAY_PRIVATE_KEY=${ALIPAY_PRIVATE_KEY}
      - ALIPAY_PUBLIC_KEY=${ALIPAY_PUBLIC_KEY}
      - WEWORK_CORP_ID=${WEWORK_CORP_ID}
      - WEWORK_AGENT_ID=${WEWORK_AGENT_ID}
      - WEWORK_CORP_SECRET=${WEWORK_CORP_SECRET}
      - QQ_CLIENT_ID=${QQ_CLIENT_ID}
      - QQ_CLIENT_SECRET=${QQ_CLIENT_SECRET}
      - NEXT_PUBLIC_ALIYUN_CAPTCHA_LOGIN_SCENE_ID=${NEXT_PUBLIC_ALIYUN_CAPTCHA_LOGIN_SCENE_ID}
      - NEXT_PUBLIC_ALIYUN_CAPTCHA_REGISTER_SCENE_ID=${NEXT_PUBLIC_ALIYUN_CAPTCHA_REGISTER_SCENE_ID}
      - NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX=${NEXT_PUBLIC_ALIYUN_CAPTCHA_PREFIX}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_CAPTCHA_ENDPOINT=${ALIYUN_CAPTCHA_ENDPOINT}
      # Cap 人机行为验证（自托管）
      - NEXT_PUBLIC_CAP_API_ENDPOINT=${NEXT_PUBLIC_CAP_API_ENDPOINT}
      - CAP_VERIFY_URL=${CAP_VERIFY_URL}
      - CAP_SECRET_KEY=${CAP_SECRET_KEY}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - APP_URL=${APP_URL}
      - SYSTEM_OPENAI_API_KEY=${SYSTEM_OPENAI_API_KEY}
      - SYSTEM_OPENAI_BASE_URL=${SYSTEM_OPENAI_BASE_URL}
      # Tencent Map API (for weather/location)
      - TENCENT_MAP_KEY=${TENCENT_MAP_KEY}
      - TENCENT_MAP_SK=${TENCENT_MAP_SK}
      # tianqiapi.com Weather API
      - TIANQI_APPID=${TIANQI_APPID}
      - TIANQI_APPSECRET=${TIANQI_APPSECRET}
      # WebSocket server for voice (internal)
      - WS_SERVER_PORT=3002
      - NEXT_SERVER_URL=http://localhost:3000
      # Resend Email Service
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      # Yjs 协作 WebSocket 服务
      - YJS_WS_PORT=${YJS_WS_PORT:-1234}
      - NEXT_PUBLIC_YJS_WS_URL=${NEXT_PUBLIC_YJS_WS_URL:-ws://localhost:1234}
      - YJS_AUTH_TOKEN=${YJS_AUTH_TOKEN:-}
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-onlyoffice_secret_change_me}
      - ONLYOFFICE_URL=${ONLYOFFICE_URL:-http://onlyoffice}
      - NEXT_PUBLIC_ONLYOFFICE_API_URL=${NEXT_PUBLIC_ONLYOFFICE_API_URL:-/onlyoffice/}
    expose:
      - "3000"
      - "3002"
    depends_on:
      - db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Yjs 协作 WebSocket 服务（独立进程，用于文档实时协同编辑）
  yjs-ws:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "ws-server/yjs-server.js"]
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - YJS_WS_PORT=1234
      - YJS_WS_HOST=0.0.0.0
      - YJS_AUTH_TOKEN=${YJS_AUTH_TOKEN:-}
      - TZ=Asia/Shanghai
    expose:
      - "1234"
    depends_on:
      - db
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # OnlyOffice Document Server（用于 Office 文档在线编辑）
  onlyoffice:
    image: onlyoffice/documentserver:8.2
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-onlyoffice_secret_change_me}
      - WOPI_ENABLED=true
      - USE_UNAUTHORIZED_STORAGE=true
      - TZ=Asia/Shanghai
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
      - ./public/uploads/docs:/srv/public/uploads/docs:ro
    # 暴露 8080 给宿主机（本地开发浏览器通过 localhost:8080 访问）
    # 生产环境若不需要直连可改为 expose
    ports:
      - "8080:80"
    # 让容器能通过 host.docker.internal 访问宿主机上的 Next.js
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
      - ./public/uploads:/app/public/uploads:ro
    depends_on:
      - web
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Cap 人机行为验证（自托管 PoW CAPTCHA，https://trycap.dev）
  # 仪表盘仅绑定本机（SSH 隧道访问）；widget/验证走 nginx /cap/ 反向代理
  cap:
    image: tiago2/cap:latest
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY}
      - REDIS_URL=redis://valkey:6379
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      valkey:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

  # Cap 所需的 Valkey（Redis 兼容）存储
  valkey:
    image: valkey/valkey:9-alpine
    volumes:
      - cap-valkey-data:/data
    command: valkey-server --save 60 1 --loglevel warning --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  onlyoffice_data:
  onlyoffice_logs:
  cap-valkey-data:
