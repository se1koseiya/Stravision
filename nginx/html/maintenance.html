<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统升级中 | System Upgrade - Stravision IoT</title>
    <style>
        :root {
            --bg-color: #050505;
            --emerald-500: #10b981;
            --emerald-900: #064e3b;
            --teal-900: #134e4a;
            --cyan-900: #164e63;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }

        /* --- Background Layers --- */
        .bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        /* 1. Perspective Grid */
        .grid-layer {
            opacity: 0.3;
            background-image: 
                linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px);
            background-size: 100px 100px;
            transform: perspective(1000px) rotateX(60deg) translateY(-200px);
            transform-origin: top;
            width: 100%;
            height: 100%;
            position: absolute;
        }
        .grid-fade {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, var(--bg-color) 0%, transparent 100%);
        }

        /* 2. Ambient Orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            mix-blend-mode: screen;
            animation: float 20s infinite ease-in-out;
            opacity: 0.4;
        }
        .orb-1 {
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: rgba(16, 185, 129, 0.15); /* Emerald */
            animation-duration: 25s;
        }
        .orb-2 {
            bottom: -20%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: rgba(19, 78, 74, 0.2); /* Teal */
            animation-duration: 30s;
            animation-delay: 2s;
        }
        .orb-3 {
            top: 30%;
            left: 20%;
            width: 50vw;
            height: 50vw;
            background: rgba(22, 78, 99, 0.1); /* Cyan */
            animation-duration: 35s;
            animation-delay: 5s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        /* 3. Noise Texture */
        .noise {
            z-index: 1;
            opacity: 0.05;
            mix-blend-mode: overlay;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* 4. Scanline Effect */
        .scanlines {
            z-index: 2;
            background: linear-gradient(rgba(18,18,18,0) 50%, rgba(0,0,0,0.2) 50%), 
                        linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }

        /* 5. Vignette */
        .vignette {
            z-index: 3;
            background: radial-gradient(circle at center, transparent 0%, rgba(5,5,5,0.8) 100%);
        }

        /* --- Content --- */
        .content-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        /* Hexagon Loader */
        .loader-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 3rem;
        }
        
        .hex-path {
            stroke-dasharray: 240;
            stroke-dashoffset: 240;
            animation: dash 3s ease-in-out infinite, rotate 8s linear infinite;
            transform-origin: center;
            stroke: #10b981;
            filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.5));
        }

        @keyframes dash {
            0% { stroke-dashoffset: 240; }
            50% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -240; }
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }

        .loader-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, rgba(16,185,129,0.2) 0%, transparent 70%);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; }
        }

        /* Typography */
        h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -0.05em;
            margin: 0 0 1rem 0;
            background: linear-gradient(to right, #ffffff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(16, 185, 129, 0.2);
        }

        .subtitle {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #10b981;
            margin-bottom: 2rem;
            font-family: monospace;
            opacity: 0.8;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .subtitle::before, .subtitle::after {
            content: "";
            height: 1px;
            width: 40px;
            background: linear-gradient(90deg, transparent, #10b981, transparent);
        }

        .message-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 2rem;
            border-radius: 1.5rem;
            color: #94a3b8;
            line-height: 1.6;
            font-size: 1rem;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
            max-width: 480px;
        }

        .message-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        }

        .progress-bar {
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.1);
            margin-top: 2rem;
            position: relative;
            overflow: hidden;
            border-radius: 2px;
        }
        .progress-fill {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 30%;
            background: #10b981;
            box-shadow: 0 0 10px #10b981;
            animation: progress 2s infinite ease-in-out;
        }
        @keyframes progress {
            0% { left: -30%; }
            100% { left: 100%; }
        }

        .action-btn {
            margin-top: 2rem;
            background: transparent;
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #10b981;
            padding: 0.75rem 2rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }
        .action-btn:hover {
            background: rgba(16, 185, 129, 0.1);
            border-color: rgba(16, 185, 129, 0.6);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.2);
            color: white;
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            font-family: monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            letter-spacing: 0.1em;
        }

    </style>
</head>
<body>
    <!-- Background Layers -->
    <div class="bg-layer grid-layer">
        <div class="grid-fade"></div>
    </div>
    
    <div class="bg-layer">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="bg-layer noise"></div>
    <div class="bg-layer scanlines"></div>
    <div class="bg-layer vignette"></div>

    <!-- Main Content -->
    <div class="content-container">
        <div class="loader-container">
            <div class="loader-glow"></div>
            <svg width="100" height="100" viewBox="0 0 100 100" fill="none">
                <path class="hex-path" d="M50 5 L93.3 30 V80 L50 105 L6.7 80 V30 Z" stroke-width="2" />
            </svg>
        </div>

        <div class="subtitle">SYSTEM MAINTENANCE</div>
        <h1>系统升级中</h1>

        <div class="message-box">
            <p>我们正在对 Stravision IoT 平台核心架构进行升级维护。</p>
            <p style="font-size: 0.9rem; margin-top: 0.5rem; color: #64748b;">
                服务暂停访问，数据安全不受影响。<br>
                预计恢复时间：<span style="color: #10b981;">尽快恢复</span>
            </p>
            
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
        </div>

        <button class="action-btn" onclick="window.location.reload()">
            刷新状态 / REFRESH STATUS
        </button>
    </div>

    <div class="footer">
        STRAVISION IOT PLATFORM &copy; 2026
    </div>

    <script>
        // Simple particle effect for extra "landing-art" feel
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 20;
                const moveX = (x - 0.5) * speed;
                const moveY = (y - 0.5) * speed;
                orb.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
</body>
</html>
