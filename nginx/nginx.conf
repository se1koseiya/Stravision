events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml model/gltf-binary model/gltf+json application/octet-stream;

    # Real IP Configuration
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream nextjs_upstream {
        server web:3000;
    }

    upstream ws_voice_upstream {
        server web:3002;  # Standalone WebSocket server for voice
    }

    server {
        listen 80;
        server_name stravision.cheesestrawberry.top localhost;

        # Static assets caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|glb|gltf|bin|wasm|draco|mp4|webm)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Voice service WebSocket proxy (standalone Node.js server)
        location /ws/voice {
            proxy_pass http://ws_voice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            
            # WebSocket timeout settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Default proxy
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            
            # WebSocket timeout for Next.js API routes
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }

    server {
        listen 443 ssl;
        server_name stravision.cheesestrawberry.top localhost;

        # SSL Certificates
        ssl_certificate /etc/nginx/certs/stravision.cheesestrawberry.top_bundle.crt;
        ssl_certificate_key /etc/nginx/certs/stravision.cheesestrawberry.top.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Static assets caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|glb|gltf|bin|wasm|draco|mp4|webm)$ {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # SSE (Server-Sent Events) endpoint - Disable buffering
        location /api/mqtt/stream {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache off;
            
            # Disable buffering for SSE
            proxy_buffering off;
            chunked_transfer_encoding off;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Long timeout for SSE
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Voice service WebSocket proxy (standalone Node.js server)
        location /ws/voice {
            proxy_pass http://ws_voice_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout settings
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Default proxy for Next.js
        location / {
            proxy_pass http://nextjs_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # WebSocket timeout for Next.js API routes
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Intercept errors from upstream
            proxy_intercept_errors on;
            error_page 502 503 504 =503 /maintenance.html;
        }

        # Maintenance Page
        location = /maintenance.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
