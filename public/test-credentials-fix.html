<!DOCTYPE html>
<html>
<head>
    <title>测试Credentials修复</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #d1ecf1; color: #0c5460; }
    </style>
</head>
<body>
    <h1>测试ASR Credentials修复</h1>
    <p>这个页面会测试修复后的ASR API是否能正确处理认证。</p>
    
    <button onclick="testAuth()">测试认证状态</button>
    <button onclick="testASR()">测试ASR功能</button>
    
    <div id="results"></div>

    <script>
        async function testAuth() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML += '<div class="info">正在检查认证状态...</div>';
            
            try {
                const response = await fetch('/api/auth/me', {
                    credentials: 'include'
                });
                
                const data = await response.json();
                
                if (data.authenticated) {
                    resultsDiv.innerHTML += '<div class="success">✅ 用户已认证: ' + (data.user?.email || data.user?.username || '未知用户') + '</div>';
                    return true;
                } else {
                    resultsDiv.innerHTML += '<div class="error">❌ 用户未认证 - 请先登录</div>';
                    return false;
                }
            } catch (error) {
                resultsDiv.innerHTML += '<div class="error">❌ 认证检查失败: ' + error.message + '</div>';
                return false;
            }
        }
        
        async function testASR() {
            const resultsDiv = document.getElementById('results');
            
            // 先检查认证
            const isAuthenticated = await testAuth();
            if (!isAuthenticated) {
                resultsDiv.innerHTML += '<div class="error">❌ 无法测试ASR - 用户未认证</div>';
                return;
            }
            
            resultsDiv.innerHTML += '<div class="info">正在测试ASR POST请求...</div>';
            
            try {
                // 创建模拟音频数据
                const audioBlob = new Blob(['fake audio data'], { type: 'audio/webm' });
                const formData = new FormData();
                formData.append('audio', audioBlob, 'test.webm');
                formData.append('language', 'zh-CN');
                formData.append('dialect', 'auto');
                
                const response = await fetch('/api/speech/recognize', {
                    method: 'POST',
                    credentials: 'include', // 关键修复
                    body: formData
                });
                
                if (response.status === 401) {
                    resultsDiv.innerHTML += '<div class="error">❌ ASR返回401 - Credentials修复失败</div>';
                } else if (response.status === 400) {
                    resultsDiv.innerHTML += '<div class="success">✅ ASR认证成功！(400错误是因为音频数据无效，这是正常的)</div>';
                } else if (response.status === 500) {
                    const errorData = await response.json();
                    if (errorData.error && errorData.error.includes('API key')) {
                        resultsDiv.innerHTML += '<div class="success">✅ ASR认证成功！(500错误是因为API密钥问题)</div>';
                    } else {
                        resultsDiv.innerHTML += '<div class="error">❌ ASR返回500: ' + errorData.error + '</div>';
                    }
                } else {
                    const responseText = await response.text();
                    resultsDiv.innerHTML += '<div class="info">ASR响应状态: ' + response.status + ', 内容: ' + responseText.substring(0, 200) + '</div>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML += '<div class="error">❌ ASR测试失败: ' + error.message + '</div>';
            }
        }
    </script>
</body>
</html>
