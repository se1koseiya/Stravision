<!DOCTYPE html>
<html>
<head>
    <title>ASR Debug Tool</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .error { color: red; }
        .success { color: green; }
        button { padding: 10px 15px; margin: 5px; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>ASR API Debug Tool</h1>
    
    <div class="section">
        <h2>1. Test GET Request (Language List)</h2>
        <button onclick="testGetRequest()">Test GET /api/speech/recognize</button>
        <div id="get-result"></div>
    </div>
    
    <div class="section">
        <h2>2. Test POST Request (Without Auth)</h2>
        <button onclick="testPostRequest()">Test POST /api/speech/recognize</button>
        <div id="post-result"></div>
    </div>
    
    <div class="section">
        <h2>3. Check Current URL and Auth</h2>
        <button onclick="checkEnvironment()">Check Environment</button>
        <div id="env-result"></div>
    </div>

    <script>
        async function testGetRequest() {
            const resultDiv = document.getElementById('get-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('/api/speech/recognize', {
                    method: 'GET',
                    credentials: 'include' // 包含cookies
                });
                
                const result = {
                    status: response.status,
                    statusText: response.statusText,
                    url: response.url,
                    headers: Object.fromEntries(response.headers.entries())
                };
                
                if (response.ok) {
                    const data = await response.json();
                    result.data = data;
                    resultDiv.innerHTML = `<div class="success">✅ Success</div><pre>${JSON.stringify(result, null, 2)}</pre>`;
                } else {
                    const errorText = await response.text();
                    result.error = errorText;
                    resultDiv.innerHTML = `<div class="error">❌ Failed</div><pre>${JSON.stringify(result, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Network Error: ${error.message}</div>`;
            }
        }
        
        async function testPostRequest() {
            const resultDiv = document.getElementById('post-result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const formData = new FormData();
                // 添加一个空的音频文件来测试
                const blob = new Blob([''], { type: 'audio/wav' });
                formData.append('audio', blob, 'test.wav');
                formData.append('language', 'zh-CN');
                
                const response = await fetch('/api/speech/recognize', {
                    method: 'POST',
                    credentials: 'include', // 包含cookies
                    body: formData
                });
                
                const result = {
                    status: response.status,
                    statusText: response.statusText,
                    url: response.url
                };
                
                const responseText = await response.text();
                result.response = responseText;
                
                if (response.status === 401) {
                    resultDiv.innerHTML = `<div class="success">✅ Expected 401 (Unauthorized)</div><pre>${JSON.stringify(result, null, 2)}</pre>`;
                } else {
                    resultDiv.innerHTML = `<div class="error">❌ Unexpected Status</div><pre>${JSON.stringify(result, null, 2)}</pre>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ Network Error: ${error.message}</div>`;
            }
        }
        
        function checkEnvironment() {
            const resultDiv = document.getElementById('env-result');
            
            const info = {
                currentURL: window.location.href,
                origin: window.location.origin,
                userAgent: navigator.userAgent,
                cookiesEnabled: navigator.cookieEnabled,
                cookies: document.cookie,
                localStorage: Object.keys(localStorage),
                sessionStorage: Object.keys(sessionStorage)
            };
            
            resultDiv.innerHTML = `<pre>${JSON.stringify(info, null, 2)}</pre>`;
        }
    </script>
</body>
</html>
