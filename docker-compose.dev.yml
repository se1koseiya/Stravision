# Development Docker Compose
# Usage: docker-compose -f docker-compose.dev.yml up
#
# This runs only the voice service in Docker while you run Next.js locally with `npm run dev`

services:
  # Python Voice Service only
  voice:
    build:
      context: ./python_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      - PORT=8000
      - TZ=Asia/Shanghai
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      # Mount source for hot reload during development
      - ./python_service:/app
    networks:
      - dev-network

networks:
  dev-network:
    driver: bridge
