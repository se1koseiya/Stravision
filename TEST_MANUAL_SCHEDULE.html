<!DOCTYPE html>
<html>
<head>
    <title>定时任务手动测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #0070f3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0051cc;
        }
        .log {
            background: #f5f5f5;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            font-family: monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>定时任务手动测试</h1>
    
    <div class="test-section">
        <h2>测试1：创建1分钟后的提醒任务</h2>
        <button onclick="test1()">创建任务</button>
        <div id="log1" class="log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试2：创建30秒后的分析任务</h2>
        <button onclick="test2()">创建任务</button>
        <div id="log2" class="log"></div>
    </div>
    
    <div class="test-section">
        <h2>测试3：查看所有任务</h2>
        <button onclick="test3()">查看任务</button>
        <div id="log3" class="log"></div>
    </div>

    <script>
        function log(id, message) {
            const logEl = document.getElementById(id);
            const time = new Date().toLocaleTimeString();
            logEl.innerHTML += `[${time}] ${message}<br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function test1() {
            log('log1', '开始创建1分钟后的提醒任务...');
            
            // 模拟localStorage操作
            const task = {
                id: `task-${Date.now()}`,
                description: '测试提醒 - 1分钟后',
                scheduledTime: Date.now() + 60 * 1000,
                taskType: 'reminder',
                payload: { test: true },
                status: 'pending'
            };
            
            // 保存到localStorage
            const tasks = JSON.parse(localStorage.getItem('ai-scheduled-tasks') || '[]');
            tasks.push(task);
            localStorage.setItem('ai-scheduled-tasks', JSON.stringify(tasks));
            
            log('log1', `任务已创建: ${task.id}`);
            log('log1', `将在 ${new Date(task.scheduledTime).toLocaleTimeString()} 执行`);
            
            // 设置定时器
            setTimeout(() => {
                log('log1', '✅ 任务执行！');
                alert('定时任务执行：' + task.description);
            }, 60 * 1000);
        }

        function test2() {
            log('log2', '开始创建30秒后的分析任务...');
            
            const task = {
                id: `task-${Date.now()}`,
                description: '测试分析 - 30秒后',
                scheduledTime: Date.now() + 30 * 1000,
                taskType: 'analysis',
                payload: { analysisType: 'environment_check' },
                status: 'pending'
            };
            
            const tasks = JSON.parse(localStorage.getItem('ai-scheduled-tasks') || '[]');
            tasks.push(task);
            localStorage.setItem('ai-scheduled-tasks', JSON.stringify(tasks));
            
            log('log2', `任务已创建: ${task.id}`);
            log('log2', `将在 ${new Date(task.scheduledTime).toLocaleTimeString()} 执行`);
            
            setTimeout(() => {
                log('log2', '✅ 任务执行！');
                log('log2', '模拟调用AI进行环境分析...');
                alert('定时任务执行：' + task.description);
            }, 30 * 1000);
        }

        function test3() {
            log('log3', '查看localStorage中的所有任务...');
            
            const tasks = JSON.parse(localStorage.getItem('ai-scheduled-tasks') || '[]');
            
            if (tasks.length === 0) {
                log('log3', '暂无任务');
            } else {
                log('log3', `共有 ${tasks.length} 个任务：`);
                tasks.forEach((task, index) => {
                    const timeLeft = task.scheduledTime - Date.now();
                    const status = timeLeft > 0 ? `还有 ${Math.floor(timeLeft/1000)} 秒` : '已过期';
                    log('log3', `${index + 1}. ${task.description} - ${status}`);
                });
            }
        }

        // 页面加载时显示说明
        window.onload = function() {
            console.log('定时任务测试页面已加载');
            console.log('请打开浏览器控制台查看详细日志');
        };
    </script>
</body>
</html>
