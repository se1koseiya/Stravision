<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Stravision</title>
<style>
  /* 落地页视觉语言：白底 + 极淡环境光 + 墨色主按钮 + #009456 品牌绿 + 0.5px 锌色细边 */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #ffffff;
    color: #0a0a0a;
    user-select: none;
    -webkit-user-select: none;
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: 0; pointer-events: none;
    background:
      radial-gradient(340px 260px at 88% 96%, rgba(0, 148, 86, 0.09), transparent 62%),
      radial-gradient(260px 200px at 78% 78%, rgba(0, 148, 86, 0.05), transparent 60%),
      radial-gradient(420px 300px at -10% -20%, rgba(24, 24, 27, 0.03), transparent 58%);
  }
  .mascot {
    position: absolute; right: -8px; bottom: -14px;
    width: 172px; height: 172px;
    object-fit: contain;
    pointer-events: none;
    animation: bob 3.2s ease-in-out infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  .wrap {
    position: relative; z-index: 1;
    height: 100%;
    display: flex; flex-direction: column;
    padding: 24px 24px 22px;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .logo {
    width: 26px; height: 26px;
    border: 0.5px solid #e4e4e7;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    background: #fff;
  }
  .name { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }
  .name .dot { color: #009456; }
  .spacer { flex: 1; }
  .status {
    font-size: 14.5px;
    font-weight: 600;
    color: #0a0a0a;
    line-height: 1.5;
    letter-spacing: -0.01em;
    max-width: 240px;
    min-height: 42px;
  }
  .status.error { color: #b42318; }
  .hint {
    margin-top: 6px;
    font-size: 10.5px;
    color: #a1a1aa;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 46px;
    max-width: 250px;
    overflow: hidden;
    line-height: 1.45;
  }
  .bar {
    margin-top: 14px;
    width: 252px;
    height: 3px;
    background: #f1f1f3;
    border-radius: 999px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%; width: 4%;
    background: #009456;
    border-radius: 999px;
    transition: width .35s ease, background-color .2s ease;
  }
  .bar-fill.error { background: #b42318; }
  .actions {
    margin-top: 14px;
    display: none;
    gap: 8px;
  }
  .actions.show { display: flex; }
  button {
    height: 32px;
    padding: 0 16px;
    font-size: 12.5px;
    font-family: inherit;
    font-weight: 500;
    border-radius: 999px;
    border: 0.5px solid #e4e4e7;
    background: #ffffff;
    color: #18181b;
    cursor: pointer;
  }
  button:hover { background: #fafafa; }
  button.primary {
    background: #0a0a0a;
    color: #ffffff;
    border-color: #0a0a0a;
  }
  button.primary:hover { background: #262626; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="mascot" src="assets/splash-mascot.png" alt="" draggable="false" />
  <div class="wrap">
    <div class="brand">
      <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a0a0a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <circle cx="12" cy="12" r="9"/>
        </svg>
      </div>
      <div class="name">Stravision<span class="dot">.</span></div>
    </div>

    <div class="spacer"></div>

    <div class="status" id="status">正在准备本地运行环境…</div>
    <div class="hint" id="hint"></div>

    <div class="bar"><div class="bar-fill" id="bar"></div></div>

    <div class="actions" id="actions">
      <button id="btn-logs">打开日志</button>
      <button id="btn-retry" class="primary">重试</button>
    </div>
  </div>

<script>
  const statusEl = document.getElementById('status');
  const hintEl = document.getElementById('hint');
  const barEl = document.getElementById('bar');
  const actionsEl = document.getElementById('actions');

  window.stravisionDesktop?.onBootstrapStatus((payload) => {
    if (!payload) return;

    if (typeof payload.progress === 'number') {
      barEl.style.width = Math.max(4, Math.min(100, payload.progress)) + '%';
    }

    if (payload.text) {
      statusEl.textContent = payload.text;
    }

    if (payload.error) {
      statusEl.classList.add('error');
      barEl.classList.add('error');
      hintEl.textContent = payload.error;
      actionsEl.classList.add('show');
    }
  });

  document.getElementById('btn-logs').addEventListener('click', () => {
    window.stravisionDesktop?.openLogs();
  });

  document.getElementById('btn-retry').addEventListener('click', () => {
    statusEl.classList.remove('error');
    barEl.classList.remove('error');
    hintEl.textContent = '';
    actionsEl.classList.remove('show');
    statusEl.textContent = '正在重试…';
    barEl.style.width = '4%';
    window.stravisionDesktop?.retryBootstrap();
  });
</script>
</body>
</html>
