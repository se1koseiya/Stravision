<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stravision IoT Project Proposal Cover</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Noto+Sans+SC:wght@400;700;900&display=swap');

        :root {
            --bg-color: #f0f4f8;
            --primary-blue: #2563eb;
            --text-dark: #0f172a;
            --tape-green: #6ee7b7;
            --tape-text: #064e3b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Space Grotesk', 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }

        /* A4 Container */
        .page-container {
            width: 210mm;
            height: 297mm;
            background: #f8fafc;
            position: relative;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transform-style: preserve-3d;
        }

        /* 
         * Plastic Wrap Effect 
         * Using multiple gradients to simulate the specular highlights and folds of plastic wrap.
         */
        .plastic-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
            mix-blend-mode: hard-light;
            opacity: 0.6;
            background: 
                /* Main highlight sweep */
                linear-gradient(125deg, transparent 30%, rgba(255,255,255,0.8) 45%, transparent 50%),
                /* Secondary reflection */
                linear-gradient(125deg, transparent 10%, rgba(255,255,255,0.4) 15%, transparent 20%),
                /* Noise texture for realism (simulated via radial gradients) */
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.1) 0%, transparent 60%);
            filter: contrast(1.2) brightness(1.1);
        }

        /* Additional folds/wrinkles */
        .fold {
            position: absolute;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.8), transparent);
            filter: blur(4px);
            z-index: 101;
            opacity: 0.7;
            pointer-events: none;
        }
        .f1 { width: 150%; height: 60px; top: 20%; left: -20%; transform: rotate(-15deg); }
        .f2 { width: 150%; height: 40px; bottom: 30%; left: -20%; transform: rotate(-10deg); }
        .f3 { width: 80%; height: 100px; top: -10%; right: -20%; transform: rotate(45deg); opacity: 0.5; }

        /* Content Layer */
        .content-layer {
            position: relative;
            z-index: 10;
            height: 100%;
            padding: 50px;
            display: flex;
            flex-direction: column;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-box {
            background: white;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .logo-img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .author-tag {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            letter-spacing: 1px;
        }

        /* Typography Section */
        .title-section {
            position: relative;
            margin-top: 20px;
            margin-bottom: 20px;
            z-index: 20;
        }

        /* Giant Outline Text Background */
        .bg-text {
            position: absolute;
            top: -60px;
            left: -30px;
            font-size: 160px;
            font-weight: 900;
            line-height: 0.85;
            color: transparent;
            -webkit-text-stroke: 2px #cbd5e1;
            z-index: -1;
            user-select: none;
            opacity: 0.6;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: -5px;
        }

        .main-title {
            font-size: 80px;
            font-weight: 900;
            color: var(--primary-blue);
            line-height: 1.1;
            margin-bottom: 20px;
            font-family: 'Noto Sans SC', sans-serif;
            text-transform: uppercase;
            letter-spacing: -2px;
            /* Gradient text */
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Drop shadow for 3D feel */
            filter: drop-shadow(0 4px 0 rgba(0,0,0,0.1));
        }

        .subtitle {
            font-size: 24px;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 30px;
            max-width: 600px;
            line-height: 1.5;
        }

        .version-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f1f5f9;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: var(--text-dark);
            border: 1px solid #e2e8f0;
        }

        /* Decorative Elements */
        .orbit-lines {
            position: absolute;
            top: 50px;
            left: 200px;
            width: 300px;
            height: 100px;
            border: 1px solid #94a3b8;
            border-radius: 50%;
            transform: rotate(-15deg);
            pointer-events: none;
        }
        .orbit-lines::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border: 1px solid #94a3b8;
            border-radius: 50%;
            transform: rotate(60deg);
        }

        .star-icon {
            position: absolute;
            color: var(--text-dark);
            animation: pulse 2s infinite;
        }
        .s1 { top: 0; left: 100px; font-size: 24px; }
        .s2 { top: 150px; left: 500px; font-size: 32px; }
        .s3 { bottom: 0; left: 0; font-size: 20px; }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        /* Icon Scatter Container (Replacing Emojis) */
        .icon-scatter {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }

        .scatter-icon {
            position: absolute;
            font-size: 32px;
            color: #64748b;
            opacity: 0.6;
            background: white;
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 6s ease-in-out infinite;
        }

        /* Icon positions based on reference scattered look */
        .i1 { top: 15%; right: 20%; animation-delay: 0s; font-size: 24px; }
        .i2 { top: 40%; left: 5%; animation-delay: 1s; font-size: 28px; }
        .i3 { bottom: 30%; right: 10%; animation-delay: 2s; font-size: 32px; color: var(--primary-blue); }
        .i4 { bottom: 15%; left: 20%; animation-delay: 0.5s; font-size: 24px; }
        .i5 { top: 10%; left: 10%; animation-delay: 1.5s; font-size: 20px; }
        
        /* 3D Thumbs Up (Simulated with Icon) */
        .thumb-icon {
            position: absolute;
            bottom: 250px;
            left: 450px;
            font-size: 60px;
            color: #f59e0b; /* Goldish */
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            transform: rotate(-15deg);
            z-index: 50;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Phones Area */
        .phones-container {
            position: absolute;
            bottom: 0;
            right: -50px;
            width: 600px;
            height: 700px;
            z-index: 30;
        }

        .phone-mockup {
            position: absolute;
            background: #1e293b;
            border-radius: 40px;
            overflow: hidden;
            border: 10px solid #2563eb; /* Stravision Blue Frame */
            box-shadow: 0 30px 60px -10px rgba(0,0,0,0.3);
        }

        /* Back Phone */
        .phone-lg {
            width: 320px;
            height: 650px;
            right: 50px;
            bottom: 50px;
            transform: rotate(0deg);
            z-index: 31;
        }

        /* Front Phone */
        .phone-sm {
            width: 280px;
            height: 560px;
            right: 250px;
            bottom: -20px;
            transform: rotate(-10deg);
            z-index: 32;
            border-color: #60a5fa; /* Lighter blue */
        }

        .screen-content {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Tapes */
        .tape-wrapper {
            position: absolute;
            bottom: 60px;
            left: -20%;
            width: 140%;
            height: 150px;
            z-index: 40;
            pointer-events: none;
            transform: rotate(-5deg);
        }

        .tape-strip {
            width: 100%;
            height: 45px;
            display: flex;
            align-items: center;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 16px;
            letter-spacing: 1px;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        .tape-mint {
            background: #6ee7b7;
            color: #064e3b;
            transform: translateX(-50px);
        }

        .tape-white {
            background: #ffffff;
            color: #1e293b;
            transform: translateX(20px);
        }

        .marquee-content {
            display: flex;
            animation: marquee 15s linear infinite;
        }

        .marquee-item {
            padding: 0 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        @media print {
            body { background: none; }
            .page-container { margin: 0; box-shadow: none; page-break-after: always; }
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Plastic Texture Overlays -->
        <div class="plastic-overlay"></div>
        <div class="fold f1"></div>
        <div class="fold f2"></div>
        <div class="fold f3"></div>

        <!-- Scattered Icons (Component Library) -->
        <div class="icon-scatter">
            <div class="scatter-icon i1"><i class="ri-seedling-line"></i></div>
            <div class="scatter-icon i2"><i class="ri-sun-line"></i></div>
            <div class="scatter-icon i3"><i class="ri-drop-line"></i></div>
            <div class="scatter-icon i4"><i class="ri-sensor-line"></i></div>
            <div class="scatter-icon i5"><i class="ri-dashboard-line"></i></div>
        </div>
        
        <!-- 3D Thumb (Simulated) -->
        <div class="thumb-icon"><i class="ri-thumb-up-fill"></i></div>

        <div class="content-layer">
            
            <!-- Header -->
            <div class="top-bar">
                <div class="logo-box">
                    <img src="../public/logo.svg" alt="Logo" class="logo-img">
                </div>
                <div class="author-tag">STRAVISION TEAM</div>
            </div>

            <!-- Title Area -->
            <div class="title-section">
                <!-- Decorative Orbit -->
                <div class="orbit-lines"></div>
                <!-- Stars -->
                <div class="star-icon s1"><i class="ri-shining-2-fill"></i></div>
                <div class="star-icon s2"><i class="ri-shining-fill"></i></div>
                <div class="star-icon s3"><i class="ri-star-s-fill"></i></div>

                <!-- Background Faded Text -->
                <div class="bg-text">IOT<br>AIOT</div>

                <!-- Main Title -->
                <div class="main-title">
                    Stravision 莓界<br>
                    <span style="font-size: 40px; color: #334155; font-weight: 700; -webkit-text-fill-color: #334155; text-shadow: none;">AI 驱动的物联网大棚种植平台</span>
                </div>

                <div class="subtitle">连接感知、边缘、云端与应用，打造从监测到联动的种植闭环。</div>

                <div class="version-badge">
                    <i class="ri-flag-2-fill" style="color: var(--primary-blue);"></i>
                    Vision 2.0
                </div>
            </div>

            <!-- Phones -->
            <div class="phones-container">
                <!-- Back Phone -->
                <div class="phone-mockup phone-lg">
                    <img src="../public/SHOWCASE.png" alt="App Screen" class="screen-content">
                </div>
                <!-- Front Phone -->
                <div class="phone-mockup phone-sm">
                    <img src="../public/SHOWCASE.png" alt="App Screen" class="screen-content">
                </div>
            </div>

        </div>

        <!-- Tapes -->
        <div class="tape-wrapper">
            <div class="tape-strip tape-mint">
                <div class="marquee-content">
                    <div class="marquee-item"><i class="ri-leaf-fill"></i> PRECISION FARMING</div>
                    <div class="marquee-item"><i class="ri-cloud-windy-fill"></i> SMART AGRICULTURE</div>
                    <div class="marquee-item"><i class="ri-database-2-fill"></i> BIG DATA</div>
                    <div class="marquee-item"><i class="ri-leaf-fill"></i> PRECISION FARMING</div>
                    <div class="marquee-item"><i class="ri-cloud-windy-fill"></i> SMART AGRICULTURE</div>
                    <div class="marquee-item"><i class="ri-database-2-fill"></i> BIG DATA</div>
                </div>
            </div>
            <div class="tape-strip tape-white">
                <div class="marquee-content">
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> STRAVISION IOT PLATFORM</div>
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> 2025 PROPOSAL</div>
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> DESIGN WORKS</div>
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> STRAVISION IOT PLATFORM</div>
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> 2025 PROPOSAL</div>
                    <div class="marquee-item"><i class="ri-sparkling-2-fill"></i> DESIGN WORKS</div>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
